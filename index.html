<style>

body{

h1,h2,h3,h4,.disp{font-family:var(--font-d);letter-spacing:.03em}

.field{margin-bottom:.7rem}

/* layout */
#app{min-height:100vh}

.side{width:13.5rem;flex-shrink:0;background:rgba(3,13,26,.9);backdrop-filter:blur(10px);

.navitem{display:flex;align-items:center;gap:.6rem;margin:0 .5rem;padding:.45rem .6rem;border-radius:.5rem;

/* panel */
.panel{position:relative;border-radius:var(--radius);border:1px solid var(--border);

.pill{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.15rem .55rem;font-size:.58rem;

.flex{display:flex}

.pcard .ovr{font-family:var(--font-d);font-size:.95rem;line-height:1}
.pcard .pos{font-family:var(--font-d);font-size:.46rem;letter-spacing:.1em;opacity:.85}
.pcard .nm{font-size:.5rem;text-align:center;margin-top:.15rem;max-width:4rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-muted)}
.rar-gold{background:linear-gradient(160deg,oklch(.88 .12 90),oklch(.55 .09 78));color:#241a04}
.rar-especial,.rar-evo{background:linear-gradient(160deg,oklch(.85 .16 155),oklch(.35 .1 162));color:#052014}
.rar-hero{background:linear-gradient(160deg,oklch(.8 .16 45),oklch(.4 .12 32));color:#280e02}

.bench-row{display:flex;gap:.4rem;justify-content:space-between;padding:.5rem .6rem;border-radius:.7rem;

.donut-wrap{position:relative}
.donut-wrap .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

.access-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.2rem}

.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 .7rem}

<script src="https://cdn.jsdelivr.net/npm/preact@10.19.6/dist/preact.umd.js"></script>

<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<script>
const { h, render, Fragment } = preact;
const { useState, useEffect, useMemo, useCallback, useRef } = preactHooks;
const html = htm.bind(h);

/* ============== CONFIG ============== */
const SB_URL = "https://syebadartcozbfchfdbw.supabase.co";
const SB_KEY = "sb_publishable_b4J1Fi8xyASpAxkrBBvCcw_RWRx1tSq";
const FLASK_API = "https://meusite-flask-api.onrender.com";

async function sb(path, { method = "GET", body, params, prefer } = {}) {
  let url = `${SB_URL}/rest/v1/${path}`;
  if (params) url += (path.includes("?") ? "&" : "?") + new URLSearchParams(params).toString();
  const headers = { apikey: SB_KEY, "Content-Type": "application/json" };
  if (prefer) headers["Prefer"] = prefer;
  const res = await fetch(url, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  if (!res.ok) { let t = ""; try { t = (await res.json()).message; } catch {} throw new Error(t || `${res.status} ${res.statusText}`); }
  if (res.status === 204) return null;
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
const sbSelect = (table, params = {}) => sb(table, { params: { select: "*", ...params } });
const sbInsert = (table, row) => sb(table, { method: "POST", body: row, prefer: "return=representation" });
const sbUpdate = (table, id, row) => sb(`${table}?id=eq.${id}`, { method: "PATCH", body: row, prefer: "return=representation" });
const sbDelete = (table, id) => sb(`${table}?id=eq.${id}`, { method: "DELETE" });
const sbDeleteWhere = (table, params) => sb(table, { method: "DELETE", params });
const bind = (setValues, key) => (value) => setValues(v => ({ ...v, [key]: value }));

function money(v) {
  v = Number(v || 0);
  const abs = Math.abs(v);
  const txt = abs >= 1e6 ? (abs / 1e6).toFixed(2) + "M" : abs >= 1e3 ? Math.round(abs / 1e3) + "K" : String(Math.round(abs));
  return (v < 0 ? "−" : "") + txt;
}
const ROMAN = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
const roman = n => ROMAN[n] || String(n);
function formationRows(f) {
  if (!f) return [1, 4, 3, 3];
  const nums = f.split("-").map(Number).filter(n => !isNaN(n));
  return [1, ...nums];
}
function rarityClass(cardType) {
  const t = (cardType || "").toLowerCase();
  if (t === "icon") return "rar-icon";
  if (t === "hero") return "rar-hero";
  if (t === "especial" || t === "evo") return "rar-especial";
  return "rar-gold";
}
function aproveitamento(w, d, l) { const g = w + d + l; return g <= 0 ? 0 : Math.round(((w * 3 + d) / (g * 3)) * 100); }

/* ============== AUTH GATE ============== */
const TOKEN_KEY = "j90_token", USER_KEY = "j90_usuario";
function useAuthGate() {
  const [state, setState] = useState({ status: "checking", usuario: null });
  useEffect(() => {
    (async () => {
      const qs = new URLSearchParams(location.search);
      let token = qs.get("token");
      const usuarioQ = qs.get("usuario");
      if (token) {
        try { localStorage.setItem(TOKEN_KEY, token); if (usuarioQ) localStorage.setItem(USER_KEY, usuarioQ); } catch {}
        const clean = location.pathname;
        history.replaceState({}, "", clean);
      } else {
        try { token = localStorage.getItem(TOKEN_KEY); } catch {}
      }
      if (!token) { setState({ status: "denied", usuario: null }); return; }
      try {
        const res = await fetch(`${FLASK_API}/api/validar-token`, { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) throw new Error("invalido");
        const data = await res.json();
        if (data.valido) setState({ status: "ok", usuario: data.usuario });
        else throw new Error("invalido");
      } catch {
        try { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); } catch {}
        setState({ status: "denied", usuario: null });
      }
    })();
  }, []);
  return state;
}

function AccessGate() {
  return html`
    <div class="access-gate">
      <div class="panel accent gate-card" style="padding:2rem 1.6rem">
        <div class="badge">\u{1F512}</div>
        <h1 class="disp upp gold" style="font-size:1.3rem;margin:0 0 .4rem">Acesso restrito</h1>
        <p class="muted" style="font-size:.85rem;line-height:1.5">
          Este painel usa o mesmo login do seu site. Entre por lá pra continuar.
        </p>
        <a href="${FLASK_API}/login" class="btn primary mt2" style="justify-content:center;width:100%">Ir para o login</a>
      </div>
    </div>`;
}

/* ============== SHARED UI ============== */
function Panel({ title, action, accent, className = "", bodyStyle = "", children }) {
  return html`
    <section class="panel ${accent ? "accent" : ""} ${className}">
      ${title ? html`
        <div class="panel-head">
          <h3 class="panel-title">${title}</h3>
          ${action || null}
        </div>
        <div class="hairline-h"></div>` : null}
      <div style="flex:1;min-height:0;${bodyStyle}">${children}</div>
    </section>`;
}
function Bar({ value, tone = "gold" }) {
  const pct = Math.max(0, Math.min(100, Math.round(value || 0)));
  return html`<div class="bar ${tone}"><i style="width:${pct}%"></i></div>`;
}
function Donut({ wins, draws, losses, size = 120 }) {
  const total = Math.max(1, wins + draws + losses);
  const r = size / 2 - 8, c = 2 * Math.PI * r;
  const segs = [["oklch(0.78 0.19 150)", wins], ["oklch(0.85 0.17 92)", draws], ["oklch(0.63 0.22 25)", losses]];
  let off = 0;
  const pct = Math.round((wins / total) * 100);
  return html`
    <div class="donut-wrap" style="width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#0b2038" stroke-width="8"/>
        ${segs.map(([color, v]) => { const len = (v/total)*c; const el = html`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}"/>`; off += len; return el; })}
      </svg>
      <div class="lbl">
        <span class="stat gold" style="font-size:1.5rem">${pct}%</span>
        <span class="muted upp" style="font-size:.52rem">${wins}V ${draws}E ${losses}D</span>
      </div>
    </div>`;
}
function Field({ label, children }) { return html`<div class="field"><label>${label}</label>${children}</div>`; }
function TextInput({ value, onChange, type = "text", placeholder = "" }) {
  return html`<input type="${type}" value="${value ?? ""}" placeholder="${placeholder}"
    onInput=${e => onChange(type === "number" ? Number(e.target.value) : e.target.value)} />`;
}
function Select({ value, onChange, options, placeholder }) {
  return html`<select onChange=${e => onChange(e.target.value)}>
    ${placeholder ? html`<option value="">${placeholder}</option>` : null}
    ${options.map(o => html`<option value="${o.value}" selected=${String(o.value) === String(value)}>${o.label}</option>`)}
  </select>`;
}
function Checkbox({ checked, onChange, label }) {
  return html`<label class="row g2" style="text-transform:none;letter-spacing:0;font-size:.8rem;color:var(--text)">
    <input type="checkbox" style="width:auto" checked=${!!checked} onChange=${e => onChange(e.target.checked)} /> ${label}
  </label>`;
}
function Modal({ onClose, children, title }) {
  return html`<div class="modal-bg" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div class="modal">
      <div class="row between" style="margin-bottom:.8rem">
        <h3 class="disp upp gold" style="font-size:.95rem;margin:0">${title}</h3>
        <button class="btn sm ghost" onClick=${onClose}>✕</button>
      </div>
      ${children}
    </div>
  </div>`;
}
function PlayerChip({ p, size = "sm" }) {
  if (!p) return html`<div class="pcard"><div class="chip" style="background:rgba(255,255,255,.04)"></div><span class="nm dim">vazio</span></div>`;
  return html`
    <div class="pcard">
      <div class="chip ${rarityClass(p.card_type)}">
        <span class="ovr">${p.current_ovr ?? p.currentOvr}</span>
        <span class="pos">${p.main_position ?? p.mainPosition}</span>
      </div>
      <span class="nm">${p.short_name || p.name}</span>
    </div>`;
}

/* ============== APP DATA HOOK ============== */
function useCareerData(refreshKey) {
  const [data, setData] = useState({ loading: true });
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const careers = await sbSelect("careers", { order: "created_at.asc" });
        const career = careers.find(c => c.status === "ATIVA") || careers[0] || null;
        if (!career) { if (!cancelled) setData({ loading: false, career: null, careers }); return; }
        const cid = `eq.${career.id}`;
        const [players, callUps, formations, tactics, competitions, campaigns, eras, eraReqs, eraObjs, eraMiles, goals, txAll, txRecent, txFull, evos] = await Promise.all([
          sbSelect("players", { career_id: cid, order: "current_ovr.desc" }),
          sbSelect("call_ups", { career_id: cid, order: "created_at.desc" }),
          sbSelect("formations", { order: "sort_order.asc" }),
          sbSelect("tactics", { career_id: cid, order: "created_at.desc" }),
          sbSelect("competitions", { career_id: cid, order: "created_at.desc" }),
          sbSelect("competition_campaigns", { career_id: cid, order: "played_on.desc" }),
          sbSelect("eras", { career_id: cid, order: "order_number.asc" }),
          sbSelect("era_requirements", { career_id: cid, order: "sort_order.asc" }),
          sbSelect("era_objectives", { career_id: cid, order: "sort_order.asc" }),
          sbSelect("era_milestones", { career_id: cid, order: "occurred_on.desc" }),
          sbSelect("financial_goals", { career_id: cid, order: "created_at.asc" }),
          sbSelect("financial_transactions", { career_id: cid, select: "kind,amount" }),
          sbSelect("financial_transactions", { career_id: cid, order: "occurred_on.desc,created_at.desc", limit: "8" }),
          sbSelect("financial_transactions", { career_id: cid, order: "occurred_on.desc,created_at.desc" }),
          sbSelect("player_evos", { career_id: cid, order: "applied_at.desc" }),
        ]);
        let callUpSlots = [];
        const activeCallUp = callUps.find(c => c.status === "ativa") || null;
        if (activeCallUp) callUpSlots = await sbSelect("call_up_slots", { call_up_id: `eq.${activeCallUp.id}`, order: "slot_index.asc" });
        if (!cancelled) setData({
          loading: false, career, careers, players, callUps, activeCallUp, callUpSlots, formations, tactics,
          competitions, campaigns, eras, eraReqs, eraObjs, eraMiles, goals, txAll, txRecent, txFull, evos,
        });
      } catch (err) {
        if (!cancelled) setData({ loading: false, error: String(err.message || err) });
      }
    })();
    return () => { cancelled = true; };
  }, [refreshKey]);
  return data;
}

/* ============== CENTRAL DO CLUBE ============== */
function CentralDoClube({ d, bump }) {
  const { career, players, activeCallUp, callUpSlots, eras, eraReqs, eraObjs, goals, txAll, txRecent, competitions, campaigns, evos, formations } = d;
  const income = txAll.filter(t => t.kind === "RECEITA").reduce((s, t) => s + Number(t.amount), 0);
  const expenses = txAll.filter(t => t.kind === "DESPESA").reduce((s, t) => s + Number(t.amount), 0);
  const caixa = Number(career.current_funds || 0) + income - expenses;
  const era = eras.find(e => e.status === "ATIVA") || null;
  const reqs = era ? eraReqs.filter(r => r.era_id === era.id) : [];
  const objs = era ? eraObjs.filter(o => o.era_id === era.id) : [];
  const evoIds = new Set(evos.map(e => e.player_id));
  const evalReq = (r) => {
    let current = 0;
    if (r.kind === "QUANTIDADE_ADQUIRIDA") current = players.filter(p => p.club_status === "ATIVO" && (!r.player_category || p.narrative_category === r.player_category) && (r.player_filter !== "LA_FABRICA" || p.la_fabrica)).length;
    else if (r.kind === "QUANTIDADE_CONVOCADA") { const ids = new Set((callUpSlots || []).filter(s => s.player_id).map(s => s.player_id)); current = players.filter(p => ids.has(p.id) && (!r.player_category || p.narrative_category === r.player_category)).length; }
    else if (r.kind === "LA_FABRICA") current = players.filter(p => p.la_fabrica && p.club_status === "ATIVO").length;
    else if (r.kind === "JOVENS_DESENVOLVIDOS") current = players.filter(p => p.la_fabrica && evoIds.has(p.id)).length;
    else current = r.manual_done ? r.target_value : 0;
    const target = Math.max(0, r.target_value || 0);
    const pct = target ? Math.min(100, Math.round((current / target) * 100)) : 0;
    return { ...r, current, target, pct, done: current >= target };
  };
  const evaluated = reqs.map(evalReq);
  const rebuildReq = evaluated.find(r => r.kind === "QUANTIDADE_ADQUIRIDA" && r.player_category === "ATUAL") || null;
  const youthReq = evaluated.find(r => r.kind === "JOVENS_DESENVOLVIDOS") || null;
  const requiredItems = evaluated.filter(r => r.required);
  const objRequired = objs.filter(o => o.required);
  const scope = requiredItems.length || objRequired.length ? [...requiredItems, ...objRequired] : [...evaluated, ...objs];
  const eraPct = scope.length ? Math.round(scope.reduce((s, i) => s + (i.pct !== undefined ? i.pct : (i.status === "CONCLUIDO" ? 100 : i.status === "EM_ANDAMENTO" ? 50 : 0)), 0) / scope.length) : 0;

  const goal = goals.find(g => g.is_primary) || goals.find(g => g.status === "ATIVO") || null;
  const goalPct = goal && goal.target_value ? Math.min(100, Math.round((caixa / goal.target_value) * 100)) : 0;

  const wlComps = competitions.filter(c => c.category === "CHAMPIONS_LEAGUE").map(c => c.id);
  const wlCampaigns = campaigns.filter(c => wlComps.includes(c.competition_id));
  const wlLast = wlCampaigns[0] || null;
  const wlRecord = wlCampaigns.reduce((a, c) => ({ w: a.w + (c.wins||0), d: a.d + (c.draws||0), l: a.l + (c.losses||0) }), { w: 0, d: 0, l: 0 });
  const mvp = wlLast?.mvp_player_id ? players.find(p => p.id === wlLast.mvp_player_id) : null;

  const upcoming = competitions.filter(c => c.status === "EM_ANDAMENTO" && c.starts_on).sort((a,b) => a.starts_on.localeCompare(b.starts_on))[0] || null;

  const byId = Object.fromEntries(players.map(p => [p.id, p]));
  const rows = activeCallUp ? formationRows(activeCallUp.formation) : [1, 4, 3, 3];
  const starterSlots = (callUpSlots || []).filter(s => s.slot_type === "TITULAR").sort((a,b) => a.slot_index - b.slot_index);
  const benchSlots = (callUpSlots || []).filter(s => s.slot_type === "BANCO").sort((a,b) => a.slot_index - b.slot_index);
  let idx = 0;
  const lines = rows.map(count => { const line = starterSlots.slice(idx, idx + count).map(s => byId[s.player_id]); idx += count; return line; });

  const laFabrica = players.filter(p => p.la_fabrica && evoIds.has(p.id)).slice(0, 6);
  const initials = (career.club_name || "").split(/\s+/).map(w => w[0]).join("").slice(0, 3).toUpperCase();

  const overallPct = aproveitamento(career.overall_wins, career.overall_draws, career.overall_losses);

  const objetivosLinhas = [];
  if (rebuildReq) objetivosLinhas.push({ t: rebuildReq.description || "Elenco adquirido", s: `${rebuildReq.current}/${rebuildReq.target}`, ok: rebuildReq.done });
  if (goal) objetivosLinhas.push({ t: goal.name, s: goal.status === "CONCLUIDO" ? "Concluído" : `${goalPct}%`, ok: goal.status === "CONCLUIDO" });
  if (youthReq) objetivosLinhas.push({ t: youthReq.description || "Jovens desenvolvidos", s: `${youthReq.current}/${youthReq.target}`, ok: youthReq.done });
  objs.forEach(o => objetivosLinhas.push({ t: o.title, s: o.status === "CONCLUIDO" ? "Concluído" : o.status === "EM_ANDAMENTO" ? "Em andamento" : "Pendente", ok: o.status === "CONCLUIDO" }));

  return html`
    <${Fragment}>
      <div class="panel accent" style="flex-direction:row;align-items:center;justify-content:space-between;padding:.6rem .9rem">
        <div class="row g3">
          <div class="crest" style="width:2.6rem;height:2.6rem;font-size:1rem">${initials || "—"}</div>
          <div>
            <div class="muted upp" style="font-size:.5rem;letter-spacing:.4em;color:var(--gold)">Modo Carreira UT</div>
            <h1 class="disp upp" style="font-size:1.4rem;margin:0">${career.club_name}</h1>
            <div class="muted upp" style="font-size:.55rem;letter-spacing:.2em">${era ? `Era ${roman(era.order_number)} — ${era.name}` : "Sem Era ativa"} · ${career.game_edition}</div>
          </div>
        </div>
        <div class="row g2 wrap">
          <div class="pill dim">Temporada&nbsp;<b class="gold">${career.season}</b></div>
          <div class="pill dim">Elenco&nbsp;<b class="gold">${rebuildReq ? `${rebuildReq.current}/${rebuildReq.target}` : players.length}</b></div>
          <div class="pill dim">Caixa&nbsp;<b class="gold">${money(caixa)}</b></div>
          <div class="pill ok">● No ar</div>
        </div>
      </div>

      <div class="grid" style="grid-template-columns:repeat(5,1fr)">
        <${Panel} title="Era Atual" accent=${true}>
          <div class="stat" style="font-size:2.2rem;line-height:.85">${era ? `Era ${roman(era.order_number)}` : "—"}</div>
          <div class="gold upp" style="font-size:.85rem;margin:.2rem 0">${era ? era.name : "Nenhuma Era ativa"}</div>
          <div class="dim" style="font-size:.68rem;margin-bottom:.5rem">${era ? (era.subtitle || "") : ""}</div>
          <${Bar} value=${eraPct} />
          <div class="muted upp mt1" style="font-size:.58rem">${eraPct}% concluída</div>
        <//>
        <${Panel} title="Reconstrução do Elenco">
          <div class="stat" style="font-size:2.4rem">${rebuildReq ? rebuildReq.current : players.length}<span class="muted" style="font-size:1.1rem">${rebuildReq ? ` / ${rebuildReq.target}` : ""}</span></div>
          <div class="muted upp mt1" style="font-size:.58rem">${rebuildReq ? (rebuildReq.description||"Elenco adquirido") : "Elenco adquirido"}</div>
          <${Bar} tone="info" value=${rebuildReq ? rebuildReq.pct : 0} />
        <//>
        <${Panel} title="Objetivo Principal">
          ${goal ? html`
            <div class="gold stat" style="font-size:1.1rem;margin-bottom:.3rem">${goal.name}</div>
            <div class="row between" style="font-size:.68rem"><span class="dim">Caixa</span><b>${money(caixa)}</b></div>
            <div class="row between" style="font-size:.68rem"><span class="dim">Alvo</span><b>${money(goal.target_value)}</b></div>
            <${Bar} value=${goalPct} />` : html`<div class="dim" style="text-align:center;padding-top:1rem">Nenhum objetivo</div>`}
        <//>
        <${Panel} title="Última FUT Champions">
          <div class="stat" style="font-size:2.2rem">${wlLast ? wlLast.wins : "—"}<span class="dim"> – </span>${wlLast ? wlLast.losses : "—"}</div>
          <div class="gold upp mt1" style="font-size:.55rem">Craque da WL</div>
          <div class="stat upp" style="font-size:1rem">${mvp ? (mvp.short_name||mvp.name) : "—"}</div>
        <//>
        <${Panel} title="Próximo Compromisso" bodyStyle="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
          ${upcoming ? html`<div class="stat upp" style="font-size:1.15rem">${upcoming.name}</div><div class="gold upp mt1" style="font-size:.6rem">Começa em ${upcoming.starts_on}</div>` : html`<div class="dim">Nenhum compromisso</div>`}
        <//>
      </div>

      <div class="grid" style="grid-template-columns:1.15fr 1fr;align-items:stretch">
        <${Panel} title="Convocação Ativa" accent=${true} action=${activeCallUp ? html`
          <div class="row g2" style="font-size:.6rem" class="upp">
            <span class="pill dim">${activeCallUp.formation}</span>
            <span class="pill dim">${activeCallUp.tactic || "—"}</span>
            <span class="pill info">${activeCallUp.eafc_code || "—"}</span>
          </div>` : null}>
          ${activeCallUp ? html`
            <div class="pitch">
              <div class="pitch-lines"></div>
              ${lines.map(line => html`<div class="pitch-row">${line.map(p => html`<${PlayerChip} p=${p} />`)}</div>`)}
            </div>
            <div class="bench-row">
              ${benchSlots.map(s => { const p = byId[s.player_id]; return html`
                <div class="bench-card ${p ? rarityClass(p.card_type) : ""}" style="${!p ? 'background:rgba(255,255,255,.04)' : ''}">
                  <span class="o">${p ? p.current_ovr : ""}</span><span class="p">${p ? p.main_position : "—"}</span>
                </div>`; })}
            </div>` : html`<div class="dim" style="text-align:center;padding:2rem 0">Nenhuma convocação ativa</div>`}
        <//>
        <div class="grid" style="grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:.6rem">
          <${Panel} title="Desempenho FUT Champions" bodyStyle="display:flex;flex-direction:column;align-items:center;justify-content:center">
            <${Donut} wins=${wlRecord.w} draws=${wlRecord.d} losses=${wlRecord.l} size=${110}/>
          <//>
          <${Panel} title="Desempenho Geral" bodyStyle="display:flex;flex-direction:column;align-items:center;justify-content:center">
            <${Donut} wins=${career.overall_wins} draws=${career.overall_draws} losses=${career.overall_losses} size=${110}/>
          <//>
          <${Panel} title="La Fábrica" className="scroll-y" bodyStyle="max-height:150px">
            ${laFabrica.length === 0 ? html`<div class="dim" style="font-size:.7rem">Nenhum jogador</div>` :
              laFabrica.map(p => html`

/* ============== GENERIC CRUD SECTION ============== */
function CrudSection({ title, items, columns, renderForm, onSave, onDelete, newLabel = "+ Novo", extra, emptyLabel = "Nada por aqui ainda", initial = {} }) {
  const [editing, setEditing] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const openNew = () => { setEditing({ ...initial }); setErr(""); };
  const openEdit = (row) => { setEditing({ ...row }); setErr(""); };
  const close = () => { setEditing(null); setErr(""); };
  const doSave = async () => {
    setBusy(true); setErr("");
    try { await onSave(editing); close(); }
    catch (e) { setErr(String(e.message || e)); }
    setBusy(false);
  };
  const doDelete = async (row) => {
    if (!confirm("Excluir este registro?")) return;
    try { await onDelete(row); } catch (e) { alert("Erro ao excluir: " + (e.message || e)); }
  };
  return html`
    <${Fragment}>
      <${Panel} title=${title} accent=${true} action=${html`
        <div class="row g2">
          ${extra || null}
          <button class="btn primary sm" onClick=${openNew}>${newLabel}</button>
        </div>`}>
        <div class="scroll-y" style="max-height:64vh">
          <table>
            <thead><tr>${columns.map(c => html`<th>${c.label}</th>`)}<th></th></tr></thead>
            <tbody>
              ${items.length === 0 ? html`<tr><td colspan=${columns.length + 1} class="dim" style="text-align:center;padding:1.4rem">${emptyLabel}</td></tr>` :
                items.map(row => html`
                <tr>
                  ${columns.map(c => html`<td>${c.render ? c.render(row) : (row[c.key] ?? "—")}</td>`)}
                  <td>
                    <div class="row g2" style="justify-content:flex-end">
                      <button class="btn sm" onClick=${() => openEdit(row)}>Editar</button>
                      <button class="btn sm danger" onClick=${() => doDelete(row)}>Excluir</button>
                    </div>
                  </td>
                </tr>`)}
            </tbody>
          </table>
        </div>
      <//>
      ${editing !== null ? html`
        <${Modal} title=${editing.id ? "Editar registro" : "Novo registro"} onClose=${close}>
          ${renderForm(editing, setEditing)}
          ${err ? html`<div class="bad" style="font-size:.75rem;margin-top:.5rem">${err}</div>` : null}
          <div class="row g2 mt2" style="justify-content:flex-end">
            <button class="btn" onClick=${close} disabled=${busy}>Cancelar</button>
            <button class="btn primary" onClick=${doSave} disabled=${busy}>${busy ? "Salvando…" : "Salvar"}</button>
          </div>
        <//>` : null}
    <//>`;
}

/* ============== MERCADO PICKER ============== */
function MercadoPicker({ token, onPick, onClose }) {
  const [nome, setNome] = useState("");
  const [posicao, setPosicao] = useState("");
  const [posicoes, setPosicoes] = useState([]);
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  useEffect(() => {
    fetch(`${FLASK_API}/api/mercado/posicoes`, { headers: { Authorization: `Bearer ${token}` } })
      .then(r => r.json()).then(d => setPosicoes(d.posicoes || [])).catch(() => {});
  }, []);
  const buscar = async () => {
    setLoading(true); setErr("");
    try {
      const params = new URLSearchParams({ por_pagina: "40" });
      if (nome) params.set("nome", nome);
      if (posicao) params.set("posicao", posicao);
      const res = await fetch(`${FLASK_API}/api/mercado?${params}`, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) throw new Error("Falha ao buscar no mercado");
      const data = await res.json();
      setResults(data.players || []);
    } catch (e) { setErr(String(e.message || e)); }
    setLoading(false);
  };
  useEffect(() => { buscar(); }, []);
  return html`
    <${Modal} title="Buscar no Mercado" onClose=${onClose}>
      <div class="row g2 wrap" style="margin-bottom:.6rem">
        <div style="flex:1;min-width:8rem"><${TextInput} value=${nome} onChange=${setNome} placeholder="Nome do jogador" /></div>
        <div style="flex:1;min-width:7rem"><${Select} value=${posicao} onChange=${setPosicao} placeholder="Posição" options=${posicoes.map(p => ({ value: p, label: p }))} /></div>
        <button class="btn primary sm" onClick=${buscar} disabled=${loading}>${loading ? "…" : "Buscar"}</button>
      </div>
      ${err ? html`<div class="bad" style="font-size:.75rem">${err}</div>` : null}
      <div class="scroll-y" style="max-height:50vh">
        ${results.map(p => html`
          <div class="row between" style="padding:.4rem .2rem;border-bottom:1px solid rgba(255,255,255,.05);font-size:.78rem">
            <div class="row g2">
              <span class="pill dim">${p.rating ?? "—"}</span>
              <span>${p.name}</span>
              <span class="dim">${p.position}</span>
              <span class="dim" style="font-size:.62rem">${p.version || ""}</span>
            </div>
            <button class="btn sm primary" onClick=${() => onPick(p)}>Usar</button>
          </div>`)}
        ${results.length === 0 && !loading ? html`<div class="dim" style="padding:1rem;text-align:center">Nenhum resultado</div>` : null}
      </div>
    <//>`;
}

/* ============== CONVOCAÇÕES ============== */
function ConvocacoesSection({ d, bump }) {
  const { callUps, formations, players, career } = d;
  const [editing, setEditing] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const openNew = () => {
    const total = formationRows(formations[0]?.name || "4-3-3").reduce((a,b)=>a+b,0);
    setEditing({ row: { formation: formations[0]?.name || "4-3-3", status: "planejada" }, starters: Array(total).fill(""), bench: Array(7).fill("") });
  };
  const openEdit = async (row) => {
    const slots = await sbSelect("call_up_slots", { call_up_id: `eq.${row.id}`, order: "slot_index.asc" });
    const total = formationRows(row.formation).reduce((a,b)=>a+b,0);
    const starters = Array(total).fill(""), bench = Array(7).fill("");
    slots.forEach(s => {
      if (s.slot_type === "TITULAR" && s.slot_index < total) starters[s.slot_index] = s.player_id;
      else if (s.slot_type === "BANCO" && s.slot_index < 7) bench[s.slot_index] = s.player_id;
    });
    setEditing({ row: { ...row }, starters, bench });
  };
  const close = () => { setEditing(null); setErr(""); };
  const setFormation = (name) => {
    const total = formationRows(name).reduce((a,b)=>a+b,0);
    setEditing(cur => {
      const starters = Array(total).fill("");
      cur.starters.forEach((val, i) => { if (i < total) starters[i] = val; });
      return { ...cur, row: { ...cur.row, formation: name }, starters };
    });
  };
  const save = async () => {
    setBusy(true); setErr("");
    try {
      const { row, starters, bench } = editing;
      const payload = { ...row };
      delete payload.created_at; delete payload.updated_at;
      let callUpId = payload.id;
      if (callUpId) { const { id, ...rest } = payload; await sbUpdate("call_ups", id, rest); }
      else { payload.career_id = career.id; const { id, ...rest } = payload; const created = await sbInsert("call_ups", rest); callUpId = created[0].id; }
      await sbDeleteWhere("call_up_slots", { call_up_id: `eq.${callUpId}` });
      const rowsToInsert = [];
      starters.forEach((pid, i) => { if (pid) rowsToInsert.push({ call_up_id: callUpId, career_id: career.id, slot_type: "TITULAR", slot_index: i, player_id: pid, position: (players.find(p=>p.id===pid)||{}).main_position || null }); });
      bench.forEach((pid, i) => { if (pid) rowsToInsert.push({ call_up_id: callUpId, career_id: career.id, slot_type: "BANCO", slot_index: i, player_id: pid, position: (players.find(p=>p.id===pid)||{}).main_position || null }); });
      if (rowsToInsert.length) await sbInsert("call_up_slots", rowsToInsert);
      close(); bump();
    } catch (e) { setErr(String(e.message || e)); }
    setBusy(false);
  };
  const del = async (row) => {
    if (!confirm("Excluir esta convocação?")) return;
    await sbDeleteWhere("call_up_slots", { call_up_id: `eq.${row.id}` });
    await sbDelete("call_ups", row.id);
    bump();
  };
  const playerOptions = players.map(p => ({ value: p.id, label: `${p.short_name||p.name} (${p.current_ovr} ${p.main_position})` }));
  return html`
    <${Fragment}>
      <${Panel} title="Convocações" accent=${true} action=${html`<button class="btn primary sm" onClick=${openNew}>+ Nova</button>`}>
        <div class="scroll-y" style="max-height:64vh">
          <table>
            <thead><tr><th>Nome</th><th>Competição</th><th>Formação</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${callUps.length === 0 ? html`<tr><td colspan="5" class="dim" style="text-align:center;padding:1.4rem">Nenhuma convocação ainda</td></tr>` : callUps.map(row => html`
                <tr>
                  <td>${row.name}</td><td>${row.competition||"—"}</td><td>${row.formation}</td>
                  <td><span class="pill ${row.status==="ativa"?"ok":"dim"}">${row.status}</span></td>
                  <td><div class="row g2" style="justify-content:flex-end">
                    <button class="btn sm" onClick=${() => openEdit(row)}>Editar</button>
                    <button class="btn sm danger" onClick=${() => del(row)}>Excluir</button>
                  </div></td>
                </tr>`)}
            </tbody>
          </table>
        </div>
      <//>
      ${editing ? html`
        <${Modal} title=${editing.row.id ? "Editar convocação" : "Nova convocação"} onClose=${close}>
          <div class="formgrid">
            <${Field} label="Nome"><${TextInput} value=${editing.row.name} onChange=${v => setEditing(c=>({...c,row:{...c.row,name:v}}))} /><//>
            <${Field} label="Competição"><${TextInput} value=${editing.row.competition} onChange=${v => setEditing(c=>({...c,row:{...c.row,competition:v}}))} /><//>
            <${Field} label="Formação"><${Select} value=${editing.row.formation} onChange=${setFormation} options=${formations.map(f=>({value:f.name,label:f.name}))} /><//>
            <${Field} label="Tática (texto)"><${TextInput} value=${editing.row.tactic} onChange=${v => setEditing(c=>({...c,row:{...c.row,tactic:v}}))} /><//>
            <${Field} label="Código EAFC"><${TextInput} value=${editing.row.eafc_code} onChange=${v => setEditing(c=>({...c,row:{...c.row,eafc_code:v}}))} /><//>
            <${Field} label="Data"><${TextInput} type="date" value=${editing.row.played_on} onChange=${v => setEditing(c=>({...c,row:{...c.row,played_on:v}}))} /><//>
            <${Field} label="Status"><${Select} value=${editing.row.status} onChange=${v => setEditing(c=>({...c,row:{...c.row,status:v}}))} options=${[{value:"ativa",label:"Ativa"},{value:"planejada",label:"Planejada"},{value:"arquivada",label:"Arquivada"}]} /><//>
          </div>
          <div class="hairline-h mt2"></div>
          <div class="muted upp" style="font-size:.62rem;letter-spacing:.16em;margin-bottom:.4rem">Titulares</div>
          <div class="grid" style="grid-template-columns:1fr 1fr;gap:.4rem .6rem">
            ${editing.starters.map((pid, i) => html`
              <${Select} value=${pid} onChange=${v => setEditing(c=>{const s=[...c.starters];s[i]=v;return {...c,starters:s};})} options=${playerOptions} placeholder="${i+1}ª posição — vazio" />`)}
          </div>
          <div class="muted upp mt2" style="font-size:.62rem;letter-spacing:.16em;margin-bottom:.4rem">Banco</div>
          <div class="grid" style="grid-template-columns:1fr 1fr;gap:.4rem .6rem">
            ${editing.bench.map((pid, i) => html`
              <${Select} value=${pid} onChange=${v => setEditing(c=>{const b=[...c.bench];b[i]=v;return {...c,bench:b};})} options=${playerOptions} placeholder="Banco ${i+1} — vazio" />`)}
          </div>
          ${err ? html`<div class="bad" style="font-size:.75rem;margin-top:.5rem">${err}</div>` : null}
          <div class="row g2 mt2" style="justify-content:flex-end">
            <button class="btn" onClick=${close} disabled=${busy}>Cancelar</button>
            <button class="btn primary" onClick=${save} disabled=${busy}>${busy?"Salvando…":"Salvar"}</button>
          </div>
        <//>` : null}
    <//>`;
}

/* ============== ERAS ============== */
function EraDetail({ era, reqs, objs, miles, careerId, bump }) {
  const saveReq = async (values) => {
    const row = { ...values }; delete row.created_at; delete row.updated_at;
    row.target_value = row.target_value ? Number(row.target_value) : 0;
    row.required = !!row.required; row.manual_done = !!row.manual_done;
    row.sort_order = row.sort_order ? Number(row.sort_order) : reqs.length + 1;
    if (row.id) { const {id,...rest}=row; await sbUpdate("era_requirements", id, rest); }
    else { row.era_id = era.id; row.career_id = careerId; const {id,...rest}=row; await sbInsert("era_requirements", rest); }
    bump();
  };
  const delReq = async (row) => { await sbDelete("era_requirements", row.id); bump(); };
  const saveObj = async (values) => {
    const row = { ...values }; delete row.created_at; delete row.updated_at;
    row.required = !!row.required; row.progress = row.progress ? Number(row.progress) : 0;
    row.sort_order = row.sort_order ? Number(row.sort_order) : objs.length + 1;
    if (row.id) { const {id,...rest}=row; await sbUpdate("era_objectives", id, rest); }
    else { row.era_id = era.id; row.career_id = careerId; const {id,...rest}=row; await sbInsert("era_objectives", rest); }
    bump();
  };
  const delObj = async (row) => { await sbDelete("era_objectives", row.id); bump(); };
  const saveMile = async (values) => {
    const row = { ...values }; delete row.created_at; delete row.updated_at;
    if (row.id) { const {id,...rest}=row; await sbUpdate("era_milestones", id, rest); }
    else { row.era_id = era.id; row.career_id = careerId; const {id,...rest}=row; await sbInsert("era_milestones", rest); }
    bump();
  };
  const delMile = async (row) => { await sbDelete("era_milestones", row.id); bump(); };
  return html`
    <${Fragment}>
      <${CrudSection} title="Requisitos" items=${reqs}
        initial=${{ kind: "QUANTIDADE_ADQUIRIDA", required: true, target_value: 1, player_filter: "QUALQUER" }}
        columns=${[
          { label: "Descrição", key: "description" },
          { label: "Tipo", key: "kind" },
          { label: "Alvo", key: "target_value" },
          { label: "Obrig.", render: r => r.required ? "Sim" : "Não" },
        ]}
        onSave=${saveReq} onDelete=${delReq}
        renderForm=${(v, setV) => html`
          <div class="formgrid">
            <div class="full"><${Field} label="Descrição"><${TextInput} value=${v.description} onChange=${bind(setV,"description")} /><//></div>
            <${Field} label="Tipo"><${Select} value=${v.kind} onChange=${bind(setV,"kind")} options=${[
              {value:"QUANTIDADE_ADQUIRIDA",label:"Qtd. adquirida"},
              {value:"QUANTIDADE_CONVOCADA",label:"Qtd. convocada"},
              {value:"LA_FABRICA",label:"La Fábrica (qtd.)"},
              {value:"JOVENS_DESENVOLVIDOS",label:"Jovens desenvolvidos"},
              {value:"OBJETIVO_MANUAL",label:"Manual"},
            ]} /><//>
            <${Field} label="Categoria do jogador"><${Select} value=${v.player_category} onChange=${bind(setV,"player_category")} options=${NARRATIVE_CATS.map(c=>({value:c,label:c}))} placeholder="Qualquer" /><//>
            <${Field} label="Filtro"><${Select} value=${v.player_filter} onChange=${bind(setV,"player_filter")} options=${[{value:"QUALQUER",label:"Qualquer"},{value:"LA_FABRICA",label:"La Fábrica"}]} /><//>
            <${Field} label="Valor alvo"><${TextInput} type="number" value=${v.target_value} onChange=${bind(setV,"target_value")} /><//>
            <${Field} label="Ordem"><${TextInput} type="number" value=${v.sort_order} onChange=${bind(setV,"sort_order")} /><//>
            <div class="full"><${Checkbox} checked=${v.required} onChange=${bind(setV,"required")} label="Obrigatório" /></div>
            ${v.kind === "OBJETIVO_MANUAL" ? html`<div class="full"><${Checkbox} checked=${v.manual_done} onChange=${bind(setV,"manual_done")} label="Concluído" /></div>` : null}
          </div>`}
      />
      <${CrudSection} title="Objetivos" items=${objs}
        initial=${{ status: "PENDENTE", required: false, progress: 0 }}
        columns=${[
          { label: "Título", key: "title" },
          { label: "Tipo", key: "kind" },
          { label: "Status", render: r => html`<span class="pill ${r.status==="CONCLUIDO"?"ok":"dim"}">${r.status}</span>` },
        ]}
        onSave=${saveObj} onDelete=${delObj}
        renderForm=${(v, setV) => html`
          <div class="formgrid">
            <div class="full"><${Field} label="Título"><${TextInput} value=${v.title} onChange=${bind(setV,"title")} /><//></div>
            <div class="full"><${Field} label="Descrição"><${TextInput} value=${v.description} onChange=${bind(setV,"description")} /><//></div>
            <${Field} label="Tipo"><${TextInput} value=${v.kind} onChange=${bind(setV,"kind")} placeholder="COMPETICAO, FINANCEIRO, LA_FABRICA…" /><//>
            <${Field} label="Status"><${Select} value=${v.status} onChange=${bind(setV,"status")} options=${[{value:"PENDENTE",label:"Pendente"},{value:"EM_ANDAMENTO",label:"Em andamento"},{value:"CONCLUIDO",label:"Concluído"}]} /><//>
            <${Field} label="Progresso (%)"><${TextInput} type="number" value=${v.progress} onChange=${bind(setV,"progress")} /><//>
            <div class="full"><${Checkbox} checked=${v.required} onChange=${bind(setV,"required")} label="Obrigatório" /></div>
          </div>`}
      />
      <${CrudSection} title="Marcos (linha do tempo)" items=${miles}
        initial=${{ category: "NARRATIVA" }}
        columns=${[
          { label: "Data", key: "occurred_on" },
          { label: "Título", key: "title" },
          { label: "Categoria", key: "category" },
        ]}
        onSave=${saveMile} onDelete=${delMile}
        renderForm=${(v, setV) => html`
          <div class="formgrid">
            <${Field} label="Data"><${TextInput} type="date" value=${v.occurred_on} onChange=${bind(setV,"occurred_on")} /><//>
            <${Field} label="Categoria"><${TextInput} value=${v.category} onChange=${bind(setV,"category")} placeholder="NARRATIVA, CONTRATACAO, EVO…" /><//>
            <div class="full"><${Field} label="Título"><${TextInput} value=${v.title} onChange=${bind(setV,"title")} /><//></div>
            <div class="full"><${Field} label="Descrição"><${TextInput} value=${v.description} onChange=${bind(setV,"description")} /><//></div>
          </div>`}
      />
    <//>`;
}

function ErasSection({ d, bump }) {
  const { eras, eraReqs, eraObjs, eraMiles, goals } = d;
  const [openEra, setOpenEra] = useState(null);
  const save = async (values) => {
    const row = { ...values }; delete row.created_at; delete row.updated_at;
    row.order_number = row.order_number ? Number(row.order_number) : 1;
    row.financial_goal_required = !!row.financial_goal_required;
    if (row.id) { const {id,...rest}=row; await sbUpdate("eras", id, rest); }
    else { row.career_id = d.career.id; const {id,...rest}=row; await sbInsert("eras", rest); }
    bump();
  };
  const del = async (row) => { await sbDelete("eras", row.id); bump(); };
  return html`
    <${Fragment}>
      <${CrudSection}
        title="Eras"
        items=${eras || []}
        initial=${{ status: "PLANEJADA", order_number: (eras||[]).length + 1, financial_goal_required: false }}
        columns=${[
          { label: "Nº", render: r => roman(r.order_number) },
          { label: "Nome", key: "name" },
          { label: "Status", render: r => html`<span class="pill ${r.status==="ATIVA"?"ok":"dim"}">${r.status}</span>` },
        ]}
        onSave=${save} onDelete=${del}
        renderForm=${(v, setV) => html`
          <div class="formgrid">
            <${Field} label="Número (ordem)"><${TextInput} type="number" value=${v.order_number} onChange=${bind(setV,"order_number")} /><//>
            <${Field} label="Nome"><${TextInput} value=${v.name} onChange=${bind(setV,"name")} /><//>
            <${Field} label="Subtítulo"><${TextInput} value=${v.subtitle} onChange=${bind(setV,"subtitle")} /><//>
            <${Field} label="Símbolo"><${TextInput} value=${v.symbol} onChange=${bind(setV,"symbol")} /><//>
            <${Field} label="Status"><${Select} value=${v.status} onChange=${bind(setV,"status")} options=${[{value:"ATIVA",label:"Ativa"},{value:"PLANEJADA",label:"Planejada"},{value:"CONCLUIDA",label:"Concluída"}]} /><//>
            <${Field} label="Tema"><${TextInput} value=${v.theme} onChange=${bind(setV,"theme")} /><//>
            <${Field} label="Início"><${TextInput} type="date" value=${v.started_on} onChange=${bind(setV,"started_on")} /><//>
            <${Field} label="Fim"><${TextInput} type="date" value=${v.ended_on} onChange=${bind(setV,"ended_on")} /><//>
            <${Field} label="Objetivo financeiro"><${Select} value=${v.financial_goal_id} onChange=${bind(setV,"financial_goal_id")} options=${(goals||[]).map(g=>({value:g.id,label:g.name}))} placeholder="Nenhum" /><//>
            <div class="full"><${Checkbox} checked=${v.financial_goal_required} onChange=${bind(setV,"financial_goal_required")} label="Objetivo financeiro obrigatório p/ concluir" /></div>
            <div class="full"><${Field} label="Descrição"><${TextInput} value=${v.description} onChange=${bind(setV,"description")} /><//></div>
          </div>`}
      />
      <${Panel} title="Requisitos, Objetivos e Marcos" accent=${true}>
        <div class="row g2 wrap" style="margin-bottom:.6rem">
          ${(eras||[]).map(e => html`<button class="btn sm ${openEra?.id===e.id?"primary":""}" onClick=${()=>setOpenEra(e)}>${roman(e.order_number)} — ${e.name}</button>`)}
        </div>
        ${openEra ? html`<${EraDetail} era=${openEra} reqs=${eraReqs.filter(r=>r.era_id===openEra.id)} objs=${eraObjs.filter(o=>o.era_id===openEra.id)} miles=${eraMiles.filter(m=>m.era_id===openEra.id)} careerId=${d.career.id} bump=${bump} />` : html`<div class="dim" style="font-size:.75rem">Selecione uma Era acima</div>`}
      <//>
    <//>`;
}

/* ============== SIDEBAR + APP ============== */
const NAV = [
  { key: "carreiras", label: "Carreiras" },
  { key: "elenco", label: "Elenco" },
  { key: "convocacoes", label: "Convocações" },
  { key: "fabrica", label: "La Fábrica" },
  { key: "taticas", label: "Táticas" },
  { key: "competicoes", label: "Competições" },
  { key: "financas", label: "Finanças" },
  { key: "eras", label: "Eras" },
];

function Sidebar({ active, onSelect, usuario, clubName }) {
  return html`
    <nav class="side">
      <div class="side-scroll">
        <div class="brand">
          <div class="name">J90</div>
          <div class="sub">Career UT</div>
        </div>
        <div class="hr"></div>
        <div class="navgroup-label">Painel</div>
        <button class="navitem ${active==="central"?"active":""}" onClick=${()=>onSelect("central")}>Central do Clube</button>
        <div class="navgroup-label">Gestão</div>
        ${NAV.map(n => html`<button class="navitem ${active===n.key?"active":""}" onClick=${()=>onSelect(n.key)}>${n.label}</button>`)}
      </div>
      <div class="side-foot">
        <div class="club-chip">
          <div class="crest">${(clubName||"—").slice(0,3).toUpperCase()}</div>
          <div>
            <div style="font-size:.72rem;font-weight:600">${clubName || "—"}</div>
            <div class="dim" style="font-size:.6rem">${usuario}</div>
          </div>
        </div>
      </div>
    </nav>`;
}

function App() {
  const auth = useAuthGate();
  const [section, setSection] = useState("central");
  const [refreshKey, setRefreshKey] = useState(0);
  const bump = () => setRefreshKey(k => k + 1);
  const d = useCareerData(refreshKey);
  let token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch {}

  if (auth.status === "checking") return html`<div class="access-gate"><div class="dim disp upp">Carregando…</div></div>`;
  if (auth.status === "denied") return html`<${AccessGate} />`;
  if (d.loading) return html`<div class="access-gate"><div class="dim disp upp">Carregando carreira…</div></div>`;
  if (d.error) return html`<div class="access-gate"><div class="bad">Erro ao carregar: ${d.error}</div></div>`;

  if (!d.career) {
    return html`
      <div class="shell">
        <${Sidebar} active="carreiras" onSelect=${()=>{}} usuario=${auth.usuario} clubName="—" />
        <div class="main">
          <div class="panel accent" style="padding:1rem 1.2rem;margin-bottom:.2rem">
            <div class="gold disp upp" style="font-size:1.1rem;margin-bottom:.2rem">Nenhuma carreira ainda</div>
            <div class="dim" style="font-size:.8rem">Crie a primeira carreira abaixo pra liberar o resto do painel.</div>
          </div>
          <${CarreirasSection} d=${{ careers: d.careers || [] }} bump=${bump} />
        </div>
      </div>`;
  }

  return html`
    <div class="shell">
      <${Sidebar} active=${section} onSelect=${setSection} usuario=${auth.usuario} clubName=${d.career.club_name} />
      <div class="main">
        ${section === "central" ? html`<${CentralDoClube} d=${d} bump=${bump} />` : null}
        ${section === "carreiras" ? html`<${CarreirasSection} d=${d} bump=${bump} />` : null}
        ${section === "elenco" ? html`<${ElencoSection} d=${d} bump=${bump} token=${token} />` : null}
        ${section === "convocacoes" ? html`<${ConvocacoesSection} d=${d} bump=${bump} />` : null}
        ${section === "fabrica" ? html`<${FabricaSection} d=${d} bump=${bump} />` : null}
        ${section === "taticas" ? html`<${TaticasSection} d=${d} bump=${bump} />` : null}
        ${section === "competicoes" ? html`<${CompeticoesSection} d=${d} bump=${bump} />` : null}
        ${section === "financas" ? html`<${FinancasSection} d=${d} bump=${bump} />` : null}
        ${section === "eras" ? html`<${ErasSection} d=${d} bump=${bump} />` : null}
      </div>
    </div>`;
}

render(html`<${App} />`, document.getElementById("app"));
</script>
